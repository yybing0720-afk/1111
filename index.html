<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>荣誉激励看板 - 全量增强版</title>
    <style>
        :root { --bg-body: #F9FBF6; --bg-section: #EBF3E4; --primary-green: #6C8E4D; --gold: #D4AF37; --white: #FFFFFF; --gold-light: #FFF9E6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
        body { background-color: var(--bg-body); color: #333; padding: 20px; }
        
        .section-wrapper { background-color: var(--bg-section); border-radius: 30px; padding: 25px; margin-bottom: 25px; }
        .section-header { margin-bottom: 20px; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; }
        
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .card { background: var(--white); border-radius: 24px; padding: 25px; box-shadow: 0 8px 20px rgba(108,142,77,0.05); display: flex; flex-direction: column; position: relative; }
        .card-title { font-weight: bold; font-size: 18px; margin-bottom: 20px; border-left: 5px solid var(--primary-green); padding-left: 12px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 滚动容器 */
        .table-container { flex-grow: 1; height: 420px; overflow-y: auto; padding-right: 5px; }
        .table-container::-webkit-scrollbar { width: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #D7E8BA; border-radius: 10px; }
        .rank-wrap { flex-grow: 1; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        thead th { position: sticky; top: 0; background: #fff; text-align: left; color: #999; font-size: 12px; padding: 10px 0; border-bottom: 2px solid #F5F5F5; z-index: 10; }
        td { padding: 14px 0; border-bottom: 1px solid #F5F5F5; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score-val { color: var(--primary-green); font-weight: 800; text-align: right; }

        /* 更多榜单按钮 */
        .btn-more { text-align: center; color: var(--primary-green); font-size: 13px; font-weight: bold; padding-top: 15px; margin-top: auto; cursor: pointer; border-top: 1px dashed #eee; display: flex; justify-content: center; align-items: center; gap: 5px;}

        /* 荣誉殿堂样式 */
        .monthly-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
        .honor-person-card { background: linear-gradient(135deg, #ffffff, #f9fbf6); border: 1px solid #e2ebd5; border-radius: 16px; padding: 16px; transition: all 0.2s; }
        .honor-person-card:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(108,142,77,0.08); }
        .award-tag { color: var(--primary-green); font-size: 11px; font-weight: bold; background: #EBF3E4; padding: 4px 10px; border-radius: 8px; display: inline-block; margin-bottom: 10px; }
        
        .quarterly-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-content: start; }
        .honor-team-card { background: linear-gradient(145deg, #fffdf7, #ffffff); border: 1px solid #FEEAAB; border-radius: 20px; padding: 25px 15px; text-align: center; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center;}
        .team-award-icon { font-size: 32px; margin-bottom: 10px; }
        .team-award-title { color: #b8860b; font-size: 12px; font-weight: bold; margin-bottom: 6px; }
        .team-name { font-size: 18px; font-weight: 900; color: #333; }

        select { border: 1px solid #D7E8BA; padding: 6px 14px; border-radius: 12px; font-size: 13px; color: var(--primary-green); outline: none; background: #fff; cursor: pointer; }

        /* 年度盛典 */
        .annual-card { background: linear-gradient(145deg, #ffffff, #fffdf7); border: 1px solid #FEEAAB; position: relative; overflow: hidden; }
        .annual-award-header { font-size: 14px; color: #856404; font-weight: bold; margin-bottom: 12px; background: #FFF4D1; display: inline-block; padding: 4px 12px; border-radius: 20px; }
        .winner-main { font-size: 24px; font-weight: bold; color: #444; margin-bottom: 4px; }
        .pioneer-row { grid-column: span 3; display: flex; justify-content: space-between; gap: 15px; padding: 20px; background: var(--gold-light); border-radius: 24px; border: 1px dashed #FEEAAB; }
        .pioneer-item { flex: 1; text-align: center; background: #fff; padding: 15px; border-radius: 15px; }
        
        .loading-overlay { position: fixed; inset: 0; background: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(3px); }
        .modal-content { background: var(--white); width: 650px; max-width: 90%; max-height: 85vh; border-radius: 24px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.15); animation: popIn 0.3s ease-out; }
        .modal-header { padding: 20px 25px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
        .modal-close { cursor: pointer; color: #999; font-size: 24px; }
        .modal-body { padding: 0 25px 25px 25px; overflow-y: auto; flex-grow: 1; }
        @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay">🏆 正在同步荣誉数据...</div>

<div id="rank-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header"><span id="modal-title">完整榜单</span><div class="modal-close" onclick="closeModal()">&times;</div></div>
        <div class="modal-body"><table style="width: 100%;"><thead id="modal-thead"></thead><tbody id="modal-tbody"></tbody></table></div>
    </div>
</div>

<div class="container">
    <div class="section-wrapper">
        <div class="section-header"><span>✨ 闪光日常</span></div>
        <div class="grid-3">
            <div class="card">
                <div class="card-title">👤 个人积分排行 <span style="font-size: 12px; color: #999;">TOP 10</span></div>
                <div class="rank-wrap"><table><thead><tr><th style="width:15%">排名</th><th style="width:25%">姓名</th><th style="width:35%">所属团队</th><th style="text-align:right">积分</th></tr></thead><tbody id="p-body"></tbody></table></div>
                <div class="btn-more" onclick="openModal('p')">查看全部榜单</div>
            </div>
            <div class="card">
                <div class="card-title">🏘️ 团队积分排行 <span style="font-size: 12px; color: #999;">TOP 10</span></div>
                <div class="rank-wrap"><table><thead><tr><th style="width:20%">排名</th><th style="width:50%">团队</th><th style="text-align:right">积分</th></tr></thead><tbody id="t-body"></tbody></table></div>
                <div class="btn-more" onclick="openModal('t')">查看全部榜单</div>
            </div>
            <div class="card">
                <div class="card-title">⭐ 新人先锋专题 <span style="font-size: 12px; color: #999;">TOP 5</span></div>
                <div id="newbie-king-spot"></div>
                <div class="rank-wrap"><table><thead><tr><th style="width:12%">排名</th><th style="width:20%">姓名</th><th style="width:28%">所属团队</th><th style="width:20%">导师</th><th style="text-align:right">积分</th></tr></thead><tbody id="n-body"></tbody></table></div>
                <div class="btn-more" onclick="openModal('n')">查看全部榜单</div>
            </div>
        </div>
    </div>

    <div class="section-wrapper">
        <div class="section-header"><span>🏰 荣誉殿堂</span></div>
        <div class="grid-2">
            <div class="card">
                <div class="card-title"><span>🎖️ 月度个人荣誉</span> <select id="m-select" onchange="renderMonthly()"></select></div>
                <div id="m-list" class="table-container monthly-grid"></div>
            </div>
            <div class="card">
                <div class="card-title"><span>🏆 季度团队荣誉</span> <select id="q-select" onchange="renderQuarterly()"></select></div>
                <div id="q-list" class="table-container quarterly-grid"></div>
            </div>
        </div>
    </div>

    <div class="section-wrapper">
        <div class="section-header"><span>🏆 年度盛典</span> <select id="a-select" onchange="renderAnnual()"></select></div>
        <div id="annual-list" class="grid-3"></div>
    </div>
</div>

<script>
    const SPREADSHEET_ID = '1-0_qK3u5CJne-RLwB8ivHNMd2ARa0d1qtuIW1tEsaj8';
    let STATE = { rankData: [], personHonor: [], teamHonor: [], annualHonor: [], pRank: [], tRank: [], nRank: [] };

    // 修改 fetchSheetData 逻辑：同时支持列名映射和物理索引存储
    async function fetchSheetData(sheetName) {
        try {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
            const response = await fetch(url);
            const text = await response.text();
            const json = JSON.parse(text.substr(47).slice(0, -2));
            const cols = json.table.cols.map(c => (c.label || "").trim()); 

            return json.table.rows.map(row => {
                let obj = {};
                // 保留原有逻辑：通过列名存值
                row.c.forEach((cell, i) => { 
                    if (cols[i]) obj[cols[i]] = cell ? (cell.f || String(cell.v)) : null; 
                    // 新增物理索引定位存储：专门用于季度团队荣誉
                    obj['col' + i] = cell ? (cell.f || String(cell.v)).trim() : "";
                });
                return obj;
            });
        } catch (e) { return []; }
    }

    async function init() {
        const [d1, d2, d3, d4] = await Promise.all([
            fetchSheetData('积分变动明细'), fetchSheetData('个人荣誉表'), fetchSheetData('团队荣誉表'), fetchSheetData('年度盛典表')
        ]);
        STATE.rankData = d1; STATE.personHonor = d2; STATE.teamHonor = d3; STATE.annualHonor = d4;
        renderRankings(); initFilters(); renderMonthly(); renderQuarterly(); renderAnnual();
        document.getElementById('loading').style.display = 'none';
    }

    function initFilters() {
        const m = [...new Set(STATE.personHonor.map(r => r['月份']))].filter(Boolean).sort().reverse();
        document.getElementById('m-select').innerHTML = m.map(v => `<option value="${v}">${v}</option>`).join('');
        // 季度筛选框逻辑：优先尝试物理索引 col0
        const q = [...new Set(STATE.teamHonor.map(r => r.col0 || r['季度']))].filter(v => v && v !== '季度').sort().reverse();
        document.getElementById('q-select').innerHTML = q.map(v => `<option value="${v}">${v}</option>`).join('');
        const a = [...new Set(STATE.annualHonor.map(r => r['年度']))].filter(Boolean).sort().reverse();
        document.getElementById('a-select').innerHTML = a.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    // 重构季度团队逻辑：物理索引定位 (col0:季度, col1:奖项, col2:团队)
    function renderQuarterly() {
        const q = document.getElementById('q-select').value;
        // 强制使用物理索引过滤
        const list = STATE.teamHonor.filter(r => String(r.col0) === q);
        const container = document.getElementById('q-list');
        
        if (list.length === 0) { container.innerHTML = '<div style="grid-column:span 2;text-align:center;padding:40px;color:#999">暂无数据</div>'; return; }

        const getIcon = (n) => {
            if (!n) return '🎖️';
            if (n.includes('冠军')) return '🏆';
            if (n.includes('先锋')) return '🚀';
            if (n.includes('突破')) return '💡';
            if (n.includes('进步')) return '📈';
            return '🏅';
        };

        container.innerHTML = list.map(r => `
            <div class="honor-team-card">
                <div class="team-award-icon">${getIcon(r.col1)}</div>
                <div class="team-award-title">${r.col1 || '团队奖项'}</div>
                <div class="team-name">${r.col2 || '未知团队'}</div>
            </div>
        `).join('');
    }

    // 其余渲染逻辑和积分逻辑保持原样
    function renderMonthly() {
        const m = document.getElementById('m-select').value;
        const list = STATE.personHonor.filter(r => r['月份'] === m);
        document.getElementById('m-list').innerHTML = list.map(r => `<div class="honor-person-card"><div class="award-tag">✨ ${r['奖项名称']}</div><div class="person-name">${r['获奖人']}</div><div class="person-dept">${r['所属部门'] || ''}</div></div>`).join('');
    }

    function renderRankings() {
        let pMap = {}; let tMap = {};
        STATE.rankData.forEach(row => {
            const name = row['姓名'], team = row['所属团队'], mentor = row['带教导师'], score = parseFloat(row['变动积分']) || 0;
            if(!name || name === '姓名') return;
            if(!pMap[name]) pMap[name] = { name, team, mentor, score: 0, isNew: row['人员属性'] === '新人' };
            pMap[name].score += score;
            if(team) { if(!tMap[team]) tMap[team] = { name: team, score: 0 }; tMap[team].score += score; }
        });
        STATE.pRank = Object.values(pMap).sort((a,b) => b.score - a.score);
        STATE.tRank = Object.values(tMap).sort((a,b) => b.score - a.score);
        STATE.nRank = STATE.pRank.filter(u => u.isNew);
        document.getElementById('p-body').innerHTML = STATE.pRank.slice(0, 10).map((item, i) => `<tr><td>${i+1}</td><td><b>${item.name}</b></td><td>${item.team || '-'}</td><td class="score-val">${item.score.toLocaleString()}</td></tr>`).join('');
        document.getElementById('t-body').innerHTML = STATE.tRank.slice(0, 10).map((item, i) => `<tr><td>${i+1}</td><td><b>${item.name}</b></td><td class="score-val">${item.score.toLocaleString()}</td></tr>`).join('');
        document.getElementById('n-body').innerHTML = STATE.nRank.slice(0, 5).map((item, i) => `<tr><td>${i+1}</td><td><b>${item.name}</b></td><td>${item.team || '-'}</td><td>${item.mentor || '-'}</td><td class="score-val">${item.score.toLocaleString()}</td></tr>`).join('');
        if(STATE.nRank[0]) document.getElementById('newbie-king-spot').innerHTML = `<div style="background:var(--gold-light); border:1px solid #FFE699; border-radius:18px; padding:15px; margin-bottom:15px;"><span class="award-tag" style="background:#FFE699; color:#856404; margin-bottom:0;">👑 季度新人王</span><div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;"><span style="font-size:24px; font-weight:bold; color:#856404;">${STATE.nRank[0].name}</span><span class="score-val" style="font-size:20px;">${STATE.nRank[0].score.toLocaleString()}</span></div></div>`;
    }

    function openModal(type) {
        const overlay = document.getElementById('rank-modal');
        const title = document.getElementById('modal-title');
        const thead = document.getElementById('modal-thead');
        const tbody = document.getElementById('modal-tbody');
        let headHTML = '', bodyHTML = '';
        if (type === 'p') { title.innerHTML = '👤 个人积分完整榜单'; headHTML = '<tr><th style="width:15%">排名</th><th style="width:25%">姓名</th><th style="width:35%">所属团队</th><th style="text-align:right">积分</th></tr>'; bodyHTML = STATE.pRank.map((item, i) => `<tr><td>${i+1}</td><td><b>${item.name}</b></td><td>${item.team || '-'}</td><td class="score-val">${item.score.toLocaleString()}</td></tr>`).join(''); }
        else if (type === 't') { title.innerHTML = '🏘️ 团队积分完整榜单'; headHTML = '<tr><th style="width:20%">排名</th><th style="width:50%">团队</th><th style="text-align:right">积分</th></tr>'; bodyHTML = STATE.tRank.map((item, i) => `<tr><td>${i+1}</td><td><b>${item.name}</b></td><td class="score-val">${item.score.toLocaleString()}</td></tr>`).join(''); }
        else if (type === 'n') { title.innerHTML = '⭐ 新人积分完整榜单'; headHTML = '<tr><th style="width:12%">排名</th><th style="width:20%">姓名</th><th style="width:28%">所属团队</th><th style="width:20%">导师</th><th style="text-align:right">积分</th></tr>'; bodyHTML = STATE.nRank.map((item, i) => `<tr><td>${i+1}</td><td><b>${item.name}</b></td><td>${item.team || '-'}</td><td>${item.mentor || '-'}</td><td class="score-val">${item.score.toLocaleString()}</td></tr>`).join(''); }
        thead.innerHTML = headHTML; tbody.innerHTML = bodyHTML; overlay.style.display = 'flex';
    }
    function closeModal(event) { if (!event || event.target.id === 'rank-modal' || event.target.classList.contains('modal-close')) document.getElementById('rank-modal').style.display = 'none'; }

    function renderAnnual() {
        const year = document.getElementById('a-select').value;
        const list = STATE.annualHonor.filter(r => String(r['年度']) === year);
        const groups = {}; list.forEach(r => { if (!groups[r['奖项分类']]) groups[r['奖项分类']] = []; groups[r['奖项分类']].push(r); });
        const container = document.getElementById('annual-list');
        if (list.length === 0) { container.innerHTML = '<div style="grid-column:span 3;text-align:center;padding:40px;color:#999">暂无数据</div>'; return; }
        let html = '';
        ['驿路巅峰团队奖', '驿路辉煌团队奖', '年度金牌mentor'].forEach(cat => { if (groups[cat]) { const w = groups[cat][0]; html += `<div class="card annual-card"><div class="annual-award-header">👑 ${cat}</div><div class="winner-main">${w['获得者/团队']}</div><div style="font-size:13px;color:#999">${w['所属部门'] || ''}</div></div>`; } });
        if (groups['驿路先锋运营奖']) html += `<div class="pioneer-row"><div style="writing-mode:vertical-lr;font-weight:bold;color:#856404;border-right:1px solid #FEEAAB;padding-right:10px">驿路先锋运营奖</div>${groups['驿路先锋运营奖'].map(w => `<div class="pioneer-item"><div style="font-size:18px;font-weight:bold">${w['获得者/团队']}</div><div style="font-size:12px;color:#999">${w['所属部门']||''}</div></div>`).join('')}</div>`;
        container.innerHTML = html;
    }
    window.onload = init;
</script>
</body>
</html>
